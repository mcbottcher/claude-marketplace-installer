[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-marketplace-installer"
version = "0.1.1"
description = "Install Claude Code plugin marketplaces from a project's .claude/settings.json"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["claude", "claude-code", "plugin", "marketplace"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
claude-install-marketplaces = "claude_marketplace_installer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_marketplace_installer"]
